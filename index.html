<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Studio Loom</title>
  <style>
    :root {
      --bg: #0a0e13; --text: #f3f6f9; --muted: #8b98a8;
      --accent: #3dd6c6; --danger: #ff5c7a; --line: #1e2833;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
    body { display: grid; grid-template-rows: auto 1fr; height: 100%; }
    header {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      padding: 8px 12px; border-bottom: 1px solid var(--line); background: #0e1319;
    }
    header strong { font-size: 13px; color: var(--muted); }
    button {
      border: 1px solid var(--line); background: #151c25; color: var(--text);
      border-radius: 9px; padding: 8px 12px; font-size: 13px; cursor: pointer;
    }
    button.primary { background: var(--accent); color: #04201c; border: 0; font-weight: 700; }
    button.danger { background: var(--danger); color: #fff; border: 0; font-weight: 700; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    label.ctrl { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
    label.ctrl input[type="range"] { width: 90px; }
    #status { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
    #recDot {
      width: 10px; height: 10px; border-radius: 50%; background: var(--danger); display: none;
      animation: pulse 1.2s infinite;
    }
    #recDot.on { display: inline-block; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255,92,122,.55); }
      70% { box-shadow: 0 0 0 10px rgba(255,92,122,0); }
    }
    .workspace { display: grid; grid-template-rows: minmax(150px, 26vh) 1fr; min-height: 0; }
    body.rec-mode .workspace { grid-template-rows: 1fr 90px; }
    body.rec-mode .prompter-box { width: min(920px, 96%); aspect-ratio: auto; height: 100%; max-height: none; }
    body.rec-mode #promptText { font-size: clamp(26px, 4vw, 46px) !important; }
    body.rec-mode .site-hint, body.rec-mode #siteFrame { display: none; }
    body.rec-mode .rec-banner { display: block; }
    .top {
      display: grid; grid-template-columns: 1fr minmax(140px, 200px);
      gap: 10px; padding: 10px; min-height: 0;
      border-bottom: 1px solid var(--line); background: #0c1117;
    }
    body.rec-mode .top { grid-template-columns: 1fr 150px; border-bottom-color: var(--danger); }
    /* PLACEHOLDER - will replace with full */
  </style>
</head>
<body>
  <div>Loading full version...</div>
</body>
</html>
